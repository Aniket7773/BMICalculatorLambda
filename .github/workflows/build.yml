name: BMI Calculator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: 'maven'
        java-package: 'jdk'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build and Test
      run: |
        mvn -B clean compile --no-transfer-progress
        mvn -B test --no-transfer-progress

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports
        retention-days: 5

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: bmi-calculator-lambda
        path: target/bmi-calculator-lambda-*.jar
        retention-days: 5